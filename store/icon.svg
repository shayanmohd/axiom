<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="charcoal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2A2220"/>
      <stop offset="0.5" stop-color="#181312"/>
      <stop offset="1" stop-color="#0C0908"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.54" r="0.52">
      <stop offset="0" stop-color="#F0454F" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#C02333" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C02333" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFAF6"/>
      <stop offset="0.55" stop-color="#EADFD7"/>
      <stop offset="1" stop-color="#BCA9A0"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F4515C"/>
      <stop offset="0.5" stop-color="#D0212F"/>
      <stop offset="1" stop-color="#7E1220"/>
    </linearGradient>
    <linearGradient id="seamlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD6CF"/>
      <stop offset="0.45" stop-color="#FF5D5A"/>
      <stop offset="1" stop-color="#B01427"/>
    </linearGradient>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="3"/>
      <feFlood flood-color="#050303" flood-opacity="0.6"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="seamglow" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="solid"><path d="M26 54 L54 26 L82 54 L54 82 Z"/></clipPath>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#charcoal)"/>
    <rect width="108" height="108" fill="url(#ember)"/>
    <!-- the lattice the proof is cut from -->
    <g stroke="#F3E4DE" stroke-opacity="0.055" stroke-width="0.7">
      <path d="M0 27 L108 27 M0 54 L108 54 M0 81 L108 81"/>
      <path d="M27 0 L27 108 M54 0 L54 108 M81 0 L81 108"/>
      <path d="M-8 46 L62 -24 M-8 100 L116 -24 M-8 154 L116 30 M46 116 L116 46"/>
    </g>
  </g>

  <g id="fg">
    <!-- shadow beneath the whole solid -->
    <path d="M26 54 L54 26 L82 54 L54 82 Z" fill="#000" opacity="0.5" transform="translate(0 3.5)" filter="url(#seamglow)"/>
    <!-- the two interlocking halves -->
    <path d="M26 54 L54 26 L54 43 L66 49 L66 59 L54 65 L54 82 Z" fill="url(#bone)"/>
    <path d="M54 26 L82 54 L54 82 L54 65 L66 59 L66 49 L54 43 Z" fill="url(#crimson)"/>
    <!-- the seam: the edge that lights when the proof snaps shut. Clipped to the solid, so the
         glow stays inside the stone instead of flaring past its points. -->
    <g clip-path="url(#solid)">
      <path d="M54 24 L54 43 L66 49 L66 59 L54 65 L54 84" fill="none" stroke="#FF4B4F"
            stroke-width="7" stroke-linejoin="round" opacity="0.8" filter="url(#seamglow)"/>
      <path d="M54 24 L54 43 L66 49 L66 59 L54 65 L54 84" fill="none" stroke="url(#seamlight)"
            stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M54 24 L54 43 L66 49" fill="none" stroke="#FFE7E2" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <!-- highlight along the top left edge, so the solid has a lit face -->
    <path d="M28.5 53.4 L54 28" fill="none" stroke="#FFFDFB" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    <path d="M55.6 28.4 L80 53" fill="none" stroke="#FF9A96" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g id="mono">
    <path d="M26 54 L54 26 L54 42 L64.5 47.3 L64.5 60.7 L54 66 L54 82 Z" fill="#000"/>
    <path d="M56 27.4 L82 54 L56 80.6 L56 67 L66.5 61.7 L66.5 46.3 L56 41 Z" fill="#000"/>
  </g>
</svg>
