<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("display.ttf"); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #F6EEE9; font-family: "Display", Georgia, serif;
    background:
      radial-gradient(52% 78% at 27% 52%, rgba(224, 58, 72, 0.30), rgba(224, 58, 72, 0) 62%),
      linear-gradient(160deg, #2A2220 0%, #181312 48%, #0B0808 100%);
  }
  .lattice { position: absolute; inset: 0; opacity: 0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(243,228,222,0.05) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, rgba(243,228,222,0.05) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(45deg, rgba(243,228,222,0.035) 0 1px, transparent 1px 128px); }
  .grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay;
    background-image: repeating-radial-gradient(circle at 21% 37%, rgba(255,255,255,0.9) 0 0.6px, transparent 0.6px 3px),
                      repeating-radial-gradient(circle at 67% 73%, rgba(255,255,255,0.7) 0 0.5px, transparent 0.5px 2.7px); }
  svg.mark { position: absolute; left: 74px; top: 66px; width: 368px; height: 368px; }
  .copy { position: absolute; left: 486px; top: 150px; width: 486px; }
  .rule { position: absolute; left: 490px; top: 128px; width: 78px; height: 5px; border-radius: 3px;
          background: linear-gradient(90deg, #FFD6CF, #D0212F); }
  h1 { margin: 0; font-size: 122px; line-height: 0.94; letter-spacing: -0.03em; font-weight: 700;
       text-shadow: 0 8px 34px rgba(8, 4, 4, 0.6); }
  p { margin: 22px 0 0 5px; font-size: 30px; line-height: 1.3; color: #F5A2A4; max-width: 460px;
      text-wrap: balance; }
</style>
</head>
<body>
  <div class="lattice"></div>
  <div class="grain"></div>

  <svg class="mark" viewBox="18 18 72 72" aria-hidden="true">
    <defs>
      <linearGradient id="bone" x1="0.1" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="#FFFAF6"/><stop offset="0.55" stop-color="#EADFD7"/><stop offset="1" stop-color="#BCA9A0"/>
      </linearGradient>
      <linearGradient id="crimson" x1="0.2" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#F4515C"/><stop offset="0.5" stop-color="#D0212F"/><stop offset="1" stop-color="#7E1220"/>
      </linearGradient>
      <linearGradient id="seamlight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFD6CF"/><stop offset="0.45" stop-color="#FF5D5A"/><stop offset="1" stop-color="#B01427"/>
      </linearGradient>
      <filter id="seamglow" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
      <clipPath id="solid"><path d="M26 54 L54 26 L82 54 L54 82 Z"/></clipPath>
    </defs>
    <path d="M26 54 L54 26 L82 54 L54 82 Z" fill="#000" opacity="0.5" transform="translate(0 3.5)" filter="url(#seamglow)"/>
    <path d="M26 54 L54 26 L54 43 L66 49 L66 59 L54 65 L54 82 Z" fill="url(#bone)"/>
    <path d="M54 26 L82 54 L54 82 L54 65 L66 59 L66 49 L54 43 Z" fill="url(#crimson)"/>
    <g clip-path="url(#solid)">
      <path d="M54 24 L54 43 L66 49 L66 59 L54 65 L54 84" fill="none" stroke="#FF4B4F"
            stroke-width="7" stroke-linejoin="round" opacity="0.8" filter="url(#seamglow)"/>
      <path d="M54 24 L54 43 L66 49 L66 59 L54 65 L54 84" fill="none" stroke="url(#seamlight)"
            stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M54 24 L54 43 L66 49" fill="none" stroke="#FFE7E2" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <path d="M28.5 53.4 L54 28" fill="none" stroke="#FFFDFB" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    <path d="M55.6 28.4 L80 53" fill="none" stroke="#FF9A96" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </svg>

  <div class="rule"></div>
  <div class="copy">
    <h1>Axiom</h1>
    <p>Real theorems, checked by a proof kernel inside the app.</p>
  </div>
</body>
</html>
